<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>스마트 주보</title>
  <style>
    /* 모바일 UI를 위한 CSS */
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      margin: 0; padding: 0; background-color: #f7f9fa; color: #202124; padding-bottom: 80px; 
    }
    header { 
      background: #fff; padding: 16px 20px; text-align: center; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 10;
    }
    header h1 { font-size: 1.2rem; margin: 0 0 10px 0; color: #333; }
    select { padding: 8px; border-radius: 6px; border: 1px solid #ddd; width: 100%; font-size: 1rem; }
    
    section { 
      background: #fff; margin: 16px; padding: 24px; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); 
    }
    h2 { font-size: 1.1rem; color: #1a73e8; margin-top: 0; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    
    .note-area { 
      width: 100%; height: 120px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; resize: none; font-size: 1rem; background: #f8f9fa;
    }
    .note-hint { font-size: 0.85rem; color: #5f6368; margin-top: 8px; }
    
    .copy-btn { 
      background: #f1f3f4; color: #1a73e8; font-weight: 600; border: none; padding: 14px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1rem; 
    }
    
    /* 하단 네비게이션 바 */
    nav { 
      position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #eee; padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; color: #5f6368; cursor: pointer; }
    .nav-item span { font-size: 1.2rem; margin-bottom: 4px; }
  </style>
</head>
<body>

  <!-- 상단 주차 선택 -->
  <header>
    <h1>동탄즐거운교회</h1>
    <select id="week-selector">
      <option value="this-week">11월 둘째 주 주보</option>
      <option value="last-week">11월 첫째 주 주보</option>
    </select>
  </header>

  <!-- 예배 안내 섹션 -->
  <section id="worship">
    <h2>📖 이번 주 말씀</h2>
    <p><strong>본문:</strong> 요한복음 3장 16절</p>
    <p><strong>제목:</strong> 하나님의 크신 사랑</p>
  </section>

  <!-- 설교 노트 섹션 -->
  <section id="notes">
    <h2>✏️ 설교 노트</h2>
    <textarea class="note-area" id="sermon-note" placeholder="오늘 깨달은 바를 적어보세요..."></textarea>
    <div class="note-hint">기기에 자동 저장됩니다.</div>
  </section>

  <!-- 헌금 안내 섹션 -->
  <section id="offering">
    <h2>🙏 헌금 안내</h2>
    <button class="copy-btn" onclick="copyAccount()">농협 351-1234-5678-90 (계좌 복사)</button>
  </section>

  <!-- 하단 네비게이션 -->
  <nav>
    <div class="nav-item"><span>📖</span>예배</div>
    <div class="nav-item"><span>📰</span>소식</div>
    <div class="nav-item"><span>🙏</span>헌금</div>
  </nav>

  <script>
    // 1. 설교 노트 자동 저장 기능 (Local Storage API 사용)
    const noteArea = document.getElementById('sermon-note');
    
    // 이전에 저장된 노트가 있다면 불러오기
    if (localStorage.getItem('savedSermonNote')) {
      noteArea.value = localStorage.getItem('savedSermonNote');
    }
    
    // 타이핑 할 때마다 실시간으로 브라우저에 저장
    noteArea.addEventListener('input', function() {
      localStorage.setItem('savedSermonNote', this.value);
    });

    // 2. 계좌번호 클릭 시 클립보드 복사 기능 (Clipboard API 사용)
    function copyAccount() {
      const account = "농협 351-1234-5678-90";
      navigator.clipboard.writeText(account).then(() => {
        alert("계좌번호가 복사되었습니다.");
      }).catch(err => {
        alert("복사에 실패했습니다. 직접 선택해 주세요.");
      });
    }
  </script>

</body>
</html>
